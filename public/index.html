<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product — Notification Pattern</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
      label { display: block; margin: 0.75rem 0 0.25rem; }
      input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
      button { margin-top: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
      #result { margin-top: 1.5rem; white-space: pre-wrap; }
      .ok { color: #0a7d2c; }
      .err { color: #b00020; }
      ul { padding-left: 1.25rem; }
      #examples { margin: 1rem 0; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
      #examples button { padding: 0.35rem 0.6rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Product</h1>
    <p>Deixe o nome vazio e o preço negativo para ver <strong>os dois erros de uma vez</strong>.</p>
    <div id="examples">
      <span>Exemplos:</span>
      <button type="button" data-name="Product 1" data-price="100">Válido</button>
      <button type="button" data-name="" data-price="-1">2 erros</button>
      <button type="button" data-name="" data-price="100">Só nome</button>
      <button type="button" data-name="Product 1" data-price="-1">Só preço</button>
      <button type="button" data-name="Product 1" data-price="0">Preço zero (válido)</button>
    </div>
    <form id="form">
      <label for="name">Name</label>
      <input id="name" name="name" value="" />
      <label for="price">Price</label>
      <input id="price" name="price" type="number" value="-1" />
      <button type="submit">Criar</button>
    </form>
    <div id="result"></div>

    <script>
      const form = document.getElementById("form");
      const result = document.getElementById("result");

      document.getElementById("examples").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-price]");
        if (!button) return;
        document.getElementById("name").value = button.dataset.name;
        document.getElementById("price").value = button.dataset.price;
        form.requestSubmit();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const name = document.getElementById("name").value;
        const price = Number(document.getElementById("price").value);

        const response = await fetch("/product", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, price }),
        });
        const body = await response.json();

        if (response.ok) {
          result.className = "ok";
          result.textContent = "Criado: " + JSON.stringify(body);
          return;
        }

        result.className = "err";
        const errors = body.errors || [body];
        result.innerHTML =
          "<strong>" + errors.length + " erro(s):</strong><ul>" +
          errors.map((e) => "<li>" + e.context + ": " + e.message + "</li>").join("") +
          "</ul>";
      });
    </script>
  </body>
</html>
